    /* 6. NIGHT: warm white/cream background, pink-to-purple-to-orange gradient lines */
    [data-theme="night"] {
      --bg-start: #faf6f0;
      --bg-mid: #f3ece2;
      --bg-end: #ebdcd0;
      --panel-bg: rgba(255, 255, 255, 0.68);

      --title-color: #271a15;
      --divider-glow: rgba(217, 70, 239, 0.5);
      --divider-shadow: rgba(249, 115, 22, 0.25);
      --glow-core: #f472b6;
      --glow-mid: #fdba74;
      --glow-outer: transparent;
      --glow-opacity: 0.6;
      --ray-start: #f43f5e;
      --ray-mid: #9333ea;
      --ray-end: #ea580c;

      --edge-vignette-op: 0.45;

      --btn-bg: rgba(255, 255, 255, 0.85);
      --btn-border: rgba(185, 140, 110, 0.24);
      --btn-color: #271a15;
      --btn-hover-bg: #ffffff;
      --menu-bg: rgba(255, 255, 255, 0.94);
      --menu-border: rgba(185, 140, 110, 0.22);
      --menu-shadow: 0 16px 36px -8px rgba(90, 60, 40, 0.16);
      --item-hover-bg: rgba(217, 70, 239, 0.08);
      --item-active-bg: rgba(249, 115, 22, 0.14);
      --item-text: #271a15;
      --item-subtext: #78655b;
    }

    /* ==========================================================================
       GLOBAL RESETS & FULL-BLEED BACKGROUND LAYERS
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      font-family: var(--font-stack);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      color: var(--title-color);
    }

    /* Dual background canvases for ultra-smooth cross-fading */
    .bg-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      transition: opacity var(--transition-duration) var(--ease-smooth);
    }

    #bgLayerA {
      opacity: 1;
    }

    #bgLayerB {
      opacity: 0;
    }

    /* ==========================================================================
       LAYOUT: CENTERED COLUMN & HEADER
       ========================================================================== */
    .app-wrapper {
      height: 100vh;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 24px 28px;
      position: relative;
      z-index: 1;
    }

    .content-column {
      width: 100%;
      max-width: 900px;
      height: 100%;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .header-area {
      flex-shrink: 0;
      text-align: center;
      padding-top: 4px;
      padding-bottom: 2px;
    }

    .title {
      font-size: clamp(2.2rem, 4.5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--title-color);
      transition: color var(--transition-duration) var(--ease-smooth);
      user-select: none;
      animation: title-reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes title-reveal {
      0% {
        opacity: 0;
        transform: translateY(-16px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .divider-line {
      flex-shrink: 0;
      width: 100%;
      height: 1.5px;
      margin: 18px 0 20px 0;
      border: none;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        var(--divider-glow) 25%,
        var(--divider-glow) 75%,
        rgba(255, 255, 255, 0) 100%
      );
      box-shadow: 0 0 14px var(--divider-shadow);
      transform-origin: center;
      animation: divider-reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both,
                 divider-glow-pulse 6s ease-in-out 1.4s infinite alternate;
      transition: background var(--transition-duration) var(--ease-smooth),
                  box-shadow var(--transition-duration) var(--ease-smooth);
    }

    @keyframes divider-reveal {
      0% {
        opacity: 0;
        transform: scaleX(0);
      }
      100% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    @keyframes divider-glow-pulse {
      0% {
        box-shadow: 0 0 10px var(--divider-shadow);
        opacity: 0.85;
      }
      100% {
        box-shadow: 0 0 22px var(--divider-glow), 0 0 6px var(--divider-glow);
        opacity: 1;
      }
    }

    /* ==========================================================================
       VISUAL PANEL
       ========================================================================== */
    .visual-panel {
      position: relative;
      flex: 1;
      min-height: 0;
      height: 100%;
      width: 100%;
      border-radius: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: default;
      animation: panel-reveal 1.25s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      transition: background var(--transition-duration) var(--ease-smooth),
                  border-color var(--transition-duration) var(--ease-smooth),
                  box-shadow var(--transition-duration) var(--ease-smooth);
    }

    @keyframes panel-reveal {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.992);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ==========================================================================
       ANTIGRAVITY UI VIGNETTE & SPOTLIGHT LAYERS
       ========================================================================== */
    /* 1. Cinematic perimeter edge vignette */
    .panel-edge-vignette {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      background: radial-gradient(
        ellipse 90% 80% at 50% 50%,
        transparent 45%,
        var(--edge-vignette-color) 100%
      );
      opacity: var(--edge-vignette-op, 0.5);
      z-index: 5;
      transition: background var(--transition-duration) var(--ease-smooth),
                  opacity var(--transition-duration) var(--ease-smooth);
    }

    /* 2. Hardware-accelerated cursor spotlight (Antigravity UI style) */
    .cursor-spotlight {
      position: absolute;
      width: 660px;
      height: 660px;
      top: -330px;
      left: -330px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        circle,
        var(--vignette-core) 0%,
        var(--vignette-mid) 45%,
        transparent 75%
      );
      z-index: 6;
      will-change: transform, opacity;
      transform: translate3d(-1000px, -1000px, 0);
      opacity: 0;
    }

    /* Soft ambient central glow backdrop */
    .glow-backdrop {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 580px;
      height: 580px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 90%,
        var(--glow-core) 0%,
        var(--glow-mid) 40%,
        transparent 75%
      );
      opacity: var(--glow-opacity);
      pointer-events: none;
      transition: background var(--transition-duration) var(--ease-smooth),
                  opacity var(--transition-duration) var(--ease-smooth);
    }

    /* Sunburst SVG container */
    .sunburst-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: block;
    }

    /* Burst rays */
    .burst-ray {
      stroke: url(#rayRadialGrad);
      stroke-linecap: round;
      animation: ray-shoot 1.3s cubic-bezier(0.16, 1, 0.3, 1) var(--shoot-del, 0s) both;
      transition: opacity var(--transition-duration) var(--ease-smooth);
    }

    @keyframes ray-shoot {
      0% {
        stroke-dashoffset: var(--len);
        opacity: 0;
      }
      20% {
        opacity: var(--base-op);
      }
      100% {
        stroke-dashoffset: 0;
        opacity: var(--base-op);
      }
    }

    /* Burst dots */
    .burst-dot {
      fill: var(--dot-color);
      animation: dot-bloom 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--shoot-del, 0s) + 0.75s) both;
      transition: fill var(--transition-duration) var(--ease-smooth),
                  opacity var(--transition-duration) var(--ease-smooth);
    }

    @keyframes dot-bloom {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      70% {
        opacity: 1;
        transform: scale(1.45);
      }
      100% {
        opacity: var(--base-op);
        transform: scale(1);
      }
    }

    /* Ray lines and dots */
    .burst-ray, .burst-dot {
      pointer-events: auto;
      cursor: pointer;
    }

    /* Click ripple wave */
    .visual-panel.pulse-active .glow-backdrop {
      transform: translateX(-50%) scale(1.22);
      opacity: 1;
    }
    .visual-panel.pulse-active .burst-ray {
      filter: drop-shadow(0 0 5px var(--divider-glow));
    }
    .visual-panel.pulse-active .burst-dot {
      transform: scale(1.4);
    }

    /* Theme switching ripple wave */
    .sunburst-svg.theme-switching .burst-ray {
      filter: drop-shadow(0 0 6px var(--divider-glow));
    }
    .sunburst-svg.theme-switching .burst-dot {
      transform: scale(1.35);
    }

    /* Icon 360 spin animation */
    .spin-anim {
      animation: icon-spin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes icon-spin {
      0% {
        transform: rotate(0deg) scale(0.75);
        opacity: 0.4;
      }
      100% {
        transform: rotate(360deg) scale(1);
        opacity: 1;
      }
    }

    /* SVG stop colors smooth transition */
    stop {
      transition: stop-color var(--transition-duration) var(--ease-smooth),
                  stop-opacity var(--transition-duration) var(--ease-smooth);
    }

    /* ==========================================================================
       THEME TOGGLE BUTTON & DROPDOWN MENU
       ========================================================================== */
    .theme-control-container {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 50;
    }

    .theme-toggle-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transition: background 0.25s ease,
                  border-color 0.25s ease,
                  transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.25s ease,
                  color var(--transition-duration) var(--ease-smooth);
      outline: none;
    }

    .theme-toggle-btn:hover {
      background: var(--btn-hover-bg);
      transform: translateY(-1px) scale(1.04);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .theme-toggle-btn:focus-visible {
      ring: 2px solid var(--divider-glow);
      outline: 2px solid var(--divider-glow);
      outline-offset: 2px;
    }

    .theme-toggle-btn:active {
      transform: scale(0.96);
    }

    .theme-btn-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      transition: transform 0.4s var(--ease-smooth);
    }

    .theme-toggle-btn[aria-expanded="true"] .theme-btn-icon-wrapper {
      transform: rotate(30deg);
    }

    /* Dropdown popover menu */
    .theme-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 218px;
      background: var(--menu-bg);
      border: 1px solid var(--menu-border);
      border-radius: 16px;
      padding: 6px;
      box-shadow: var(--menu-shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 3px;
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.22s var(--ease-smooth),
                  transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1),
                  visibility 0.22s ease;
      z-index: 100;
    }

      if (s <= 0) s += 2147483646;
      return function() {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };

        // Multi-tier rhythmic lengths

        let length;

        // Shimmer timing: varied durations and negative offsets

        const delay = (-prng() * 8.0).toFixed(2);

    // Distance from point to 2D line segment squared
    function distToSegmentSquared(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
      if (l2 === 0) return (px - x1) * (px - x1) + (py - y1) * (py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      const projX = x1 + t * (x2 - x1);
      const projY = y1 + t * (y2 - y1);
      return (px - projX) * (px - projX) + (py - projY) * (py - projY);

      // Base (x1, y1) stays strictly pinned at (500, 630)

    }

    function closeModal() {
      guideModalOverlay.classList.remove("is-open");
      guideModalOverlay.setAttribute("aria-hidden", "true");
    }

    if (manualGuideBtn) {
      manualGuideBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openModal("manual");
      });
    }

    if (agentPromptBtn) {
      agentPromptBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openModal("agent");
      });
    }

    if (modalCloseBtn) {
      modalCloseBtn.addEventListener("click", closeModal);
    }

    if (guideModalOverlay) {
      guideModalOverlay.addEventListener("click", (e) => {
        if (e.target === guideModalOverlay) closeModal();
      });
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && guideModalOverlay && guideModalOverlay.classList.contains("is-open")) {
        closeModal();
      }
    });

    /* ==========================================================================
       INITIALIZATION
       ========================================================================== */
    window.addEventListener("DOMContentLoaded", () => {
      updatePanelMetrics();
      buildSunburst();
      renderThemeMenu();

      let initialTheme = "sunrise";
      try {
        const saved = localStorage.getItem("the-task-theme");
        if (saved && THEMES.some(t => t.id === saved)) {
          initialTheme = saved;
        }
      } catch (e) {}

      initBackground(initialTheme);
      applyTheme(initialTheme, true);
    });
  </script>
</body>
</html>
